// Azur Launcher: JavaFX 21 app, GPL-3.0 (fork of Azur, see NOTICE).
// Tasks: test (unit tests), releaseJar (the one cross-platform jar).

plugins {
    id 'java'
}

group = 'com.azur'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    javafxVersion = '21.0.2'
    gsonVersion = '2.11.0'
    junitVersion = '5.11.3'
}

// One jar must run everywhere: JavaFX natives for Windows x64, Linux x64, macOS arm64 and macOS x64.
def javafxPlatforms = ['win', 'linux', 'mac', 'mac-aarch64']
def javafxModules = ['base', 'graphics', 'controls']

// JavaFX publishes empty jars without a classifier: the classes and the natives live in the platform jars.
def hostPlatform = {
    String os = System.getProperty('os.name', '').toLowerCase(Locale.ROOT)
    String arch = System.getProperty('os.arch', '').toLowerCase(Locale.ROOT)
    if (os.contains('win')) {
        return 'win'
    }
    if (os.contains('mac') || os.contains('darwin')) {
        return (arch.contains('aarch64') || arch.contains('arm64')) ? 'mac-aarch64' : 'mac'
    }
    return 'linux'
}()

def platformConfigs = javafxPlatforms.collectEntries { platform ->
    [(platform): configurations.create("javafxPlatform_${platform}".toString())]
}

dependencies {
    javafxModules.each { module ->
        implementation "org.openjfx:javafx-${module}:${javafxVersion}:${hostPlatform}"
    }
    implementation "com.google.code.gson:gson:${gsonVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    // Gradle 9 no longer ships the platform launcher with the test runtime.
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.3"

    javafxPlatforms.each { platform ->
        javafxModules.each { module ->
            add("javafxPlatform_${platform}", "org.openjfx:javafx-${module}:${javafxVersion}:${platform}")
        }
    }
}

processResources {
    // Licence texts shown on the About page: packaged as legal/LICENSE and legal/NOTICE.
    from(projectDir) {
        include 'LICENSE', 'NOTICE'
        into 'legal'
    }
}

/**
 * The updater inside the jar must be built from the current Go sources. An older build has no machine mode: it
 * ignores `azur-updater sync --json`, starts its local web UI and never prints a JSON event, so pack sync hangs
 * (and that page answers 400). Such a jar is refused instead of shipped.
 */
def updaterSources = fileTree('../tools/updater') { include '**/*.go' }

def assertUpdaterFresh = {
    def binaries = fileTree('../tools/updater/dist-bin') { include 'azur-updater-*' }.files
    if (binaries.isEmpty()) {
        throw new GradleException('tools/updater/dist-bin has no azur-updater binaries: run tools/updater/build.sh')
    }
    long newestSource = updaterSources.files.collect { it.lastModified() }.max() ?: 0L
    def stale = binaries.findAll { it.lastModified() < newestSource }
    if (!stale.isEmpty()) {
        throw new GradleException('azur-updater binaries are older than the Go sources (' +
                stale.collect { it.name }.sort().join(', ') + '): run tools/updater/build.sh, then rebuild the jar')
    }
}

/**
 * Fat jar: launcher classes and the classes of every runtime dependency at the root, JavaFX natives per platform
 * under natives/<platform>/ (FxNatives extracts the set of the running machine before JavaFX starts).
 */
def configureFatJar = { Jar task, String directory ->
    task.archiveFileName = 'azur-launcher-all.jar'
    task.destinationDirectory = layout.buildDirectory.dir(directory)
    task.duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    task.manifest {
        attributes 'Main-Class': 'com.azur.launcher.Launcher'
    }
    task.from(sourceSets.main.output)
    // Classes of the app dependencies and of every platform jar (the classes are the same, only the natives differ).
    task.from({
        (configurations.runtimeClasspath + javafxPlatforms.collect { platformConfigs[it] })
                .flatten()
                .findAll { it.name.endsWith('.jar') }
                .collect { zipTree(it) }
    }) {
        exclude 'META-INF/**'
        exclude 'module-info.class'
        exclude '**/*.dylib'
        exclude '**/*.dll'
        exclude '**/*.so'
    }
    // Natives per platform: FxNatives picks the folder of the running machine.
    javafxPlatforms.each { platform ->
        task.from({ platformConfigs[platform].collect { zipTree(it) } }) {
            include '*.dll', '*.so', '*.dylib'
            into "natives/${platform}"
        }
    }
    // The pack updater travels inside the jar (UpdaterBinary extracts the copy of the running platform into
    // <data>/bin), so one file is enough for the players. Build the binaries with tools/updater/build.sh first.
    def updaterBin = file('../tools/updater/dist-bin')
    if (updaterBin.isDirectory()) {
        task.from(updaterBin) {
            include 'azur-updater-*'
            into 'updater'
        }
        task.doFirst { assertUpdaterFresh() }
    } else {
        task.doFirst {
            logger.warn('WARNING: ../tools/updater/dist-bin is missing: the jar carries no azur-updater (run tools/updater/build.sh)')
        }
    }
}

tasks.register('releaseJar', Jar) { Jar task ->
    configureFatJar(task, 'libs')
    description = 'The one cross-platform launcher jar (what players get).'
    group = 'build'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // i18n and CJK tests read paths relative to the project, not the repository root.
    workingDir = projectDir
}
