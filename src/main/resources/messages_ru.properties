telemetry.text=Помогает находить ошибки установки. Отправляется: версия лаунчера, система (Windows, macOS или Linux), шаг установки, успех или одно слово об ошибке (сеть, подпись, Java, мод, диск, вход), время шага и случайный номер установки. Не отправляются: ник, пути, адреса, логи. По умолчанию выключено; при выключении данные этого номера удаляются на сайте.
